<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<meta name="author" content="james.suw">
<title>Will you be my Valentine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="layer warm"></div>
<div class="layer glow"></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="layer vignette"></div>
<div class="layer grain"></div>

<main class="ui">
  <p class="eyebrow"></p>
  <h1 class="title" aria-label="Will you be my Valentine?">
    <span class="line" aria-hidden="true"></span>
    <span class="script" aria-hidden="true"></span>
  </h1>
  <p class="plea" aria-live="polite"></p>
  <p class="note"></p>
  <div class="actions">
    <button class="btn yes" id="yes" type="button">Yes</button>
    <button class="btn no" id="no" type="button">No</button>
  </div>
  <a class="btn tell" hidden></a>
  <a class="again" href="./">Make one for your Valentine</a>
</main>

<section class="maker" hidden>
  <p class="m-eyebrow">Ask them with a rose</p>
  <h2 class="m-title">Who is your Valentine?</h2>
  <form class="m-form" autocomplete="off">
    <div class="m-fields">
      <label><span>To</span><input id="m-to" type="text" maxlength="30" required placeholder="Their name" autocapitalize="words"></label>
      <label><span>From</span><input id="m-from" type="text" maxlength="30" placeholder="Your name" autocapitalize="words"></label>
    </div>
    <button class="m-more" type="button" aria-expanded="false" aria-controls="m-wa-row">+ Get their answer on WhatsApp</button>
    <label class="m-wa-row" id="m-wa-row" hidden><span>Your WhatsApp</span><input id="m-wa" type="tel" inputmode="tel" maxlength="22" placeholder="+62 812 3456 7890"><em>With country code. They can send you their answer in one tap.</em></label>
    <div class="m-actions"><button class="btn yes" type="submit">Create link</button></div>
  </form>
  <div class="m-result" hidden>
    <p class="m-hint">Your link for <b></b> is ready</p>
    <input id="m-link" type="text" readonly aria-label="Your Valentine link">
    <div class="m-actions">
      <button class="btn yes" id="m-copy" type="button">Copy link</button>
      <button class="btn no" id="m-share" type="button">Share</button>
      <a class="btn no" id="m-open" target="_blank" rel="noopener">Preview</a>
    </div>
    <button class="m-back" type="button">Make another</button>
  </div>
</section>

<a class="tip" hidden target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v2.5M12 3v2.5"/></svg>
  <span>Buy me a coffee</span>
</a>
<p class="credit">Developed by james.suw</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
